[package]
name = "cas_backend"
version = "0.1.0"
edition = "2021"
description = "RustCAS-X API — Axum rewrite of cas-jjq backend"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.17"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
mime = "0.3"
time = { version = "0.3", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
url = "2"
urlencoding = "2"
futures-util = "0.3"
tokio-stream = "0.1"
async-trait = "0.1"
rsa = { version = "0.9", features = ["pem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
