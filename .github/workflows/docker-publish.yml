name: Docker Publish

permissions:
  contents: write
  packages: write

# 仅 main/master 推送触发（标签推送不单独跑，避免双构建）
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  IMAGE_NAME: rustcas-x
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image names
        id: image
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "GHCR=ghcr.io/${owner_lc}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]]; then
            echo "DOCKERHUB=${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
            echo "HAS_DOCKERHUB=true" >> "$GITHUB_OUTPUT"
          else
            echo "DOCKERHUB=" >> "$GITHUB_OUTPUT"
            echo "HAS_DOCKERHUB=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version from git tag on this commit
        id: get_version
        run: |
          exact_tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [[ "$exact_tag" == v* ]]; then
            echo "VERSION=${exact_tag}" >> "$GITHUB_OUTPUT"
            echo "HAS_RELEASE_TAG=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "HAS_RELEASE_TAG=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels) for GHCR
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.GHCR }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.get_version.outputs.VERSION }},enable=${{ steps.get_version.outputs.HAS_RELEASE_TAG == 'true' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || steps.get_version.outputs.HAS_RELEASE_TAG == 'true' }}

      - name: Extract metadata (tags, labels) for Docker Hub
        id: meta_dockerhub
        if: steps.image.outputs.HAS_DOCKERHUB == 'true'
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.DOCKERHUB }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.get_version.outputs.VERSION }},enable=${{ steps.get_version.outputs.HAS_RELEASE_TAG == 'true' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || steps.get_version.outputs.HAS_RELEASE_TAG == 'true' }}

      - name: Extract metadata (tags, labels) for Aliyun
        id: meta_aliyun
        if: steps.image.outputs.HAS_DOCKERHUB == 'true'
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.ALIYUN_REGISTRY }}/${{ steps.image.outputs.DOCKERHUB }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.get_version.outputs.VERSION }},enable=${{ steps.get_version.outputs.HAS_RELEASE_TAG == 'true' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || steps.get_version.outputs.HAS_RELEASE_TAG == 'true' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v5
        with:
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TAG=${{ steps.get_version.outputs.VERSION }}
          context: .
          # Wave-0: amd64 first（Rust 多架构 qemu 过慢）；后续再加 arm64
          platforms: linux/amd64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}

      - name: Login to Docker Hub
        if: steps.image.outputs.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker Hub image
        if: steps.image.outputs.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v5
        with:
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TAG=${{ steps.get_version.outputs.VERSION }}
          context: .
          platforms: linux/amd64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}

      - name: Login to Aliyun with retry
        id: aliyun_login
        if: steps.image.outputs.HAS_DOCKERHUB == 'true'
        continue-on-error: true
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_TOKEN: ${{ secrets.ALIYUN_TOKEN }}
        run: |
          if [[ -z "${ALIYUN_USERNAME}" || -z "${ALIYUN_TOKEN}" ]]; then
            echo "Aliyun credentials are not configured, skipping push."
            exit 1
          fi
          for attempt in 1 2 3; do
            if printf '%s' "${ALIYUN_TOKEN}" | docker login "${ALIYUN_REGISTRY}" --username "${ALIYUN_USERNAME}" --password-stdin; then
              exit 0
            fi
            echo "Aliyun registry login failed (attempt ${attempt}/3), retrying..." >&2
            sleep $((attempt * 15))
          done
          exit 1

      - name: Build and push Aliyun image
        id: push_aliyun
        if: steps.aliyun_login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TAG=${{ steps.get_version.outputs.VERSION }}
          context: .
          platforms: linux/amd64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_aliyun.outputs.tags }}
          labels: ${{ steps.meta_aliyun.outputs.labels }}

      - name: Summarize publish status
        if: always()
        run: |
          echo "### Publish summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHCR: \`${{ steps.image.outputs.GHCR }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.image.outputs.HAS_DOCKERHUB }}" == "true" ]]; then
            echo "- Docker Hub: \`${{ steps.image.outputs.DOCKERHUB }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Docker Hub: skipped (set DOCKERHUB_USERNAME / DOCKERHUB_TOKEN to enable)" >> "$GITHUB_STEP_SUMMARY"
          fi
